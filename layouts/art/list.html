{{ define "main" }}
<h1 class="post-title">{{ .Title }}</h1>

<div class="gallery-grid">
  {{ range .Pages }}
    {{ $img := .Resources.ByType "image" | first 1 }}
    <a href="{{ .Permalink }}" class="gallery-tile">
      {{ with $img }}
        {{ range . }}
          <img src="{{ .RelPermalink }}" alt="{{ $.Title }}" loading="lazy">
        {{ end }}
      {{ end }}
      <span class="gallery-tile-title">{{ .Title }}</span>
    </a>
  {{ end }}
</div>
{{ end }}
