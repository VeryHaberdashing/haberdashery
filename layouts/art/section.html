{{ define "main" }}
<h1 class="post-title">{{ .Title }}</h1>

<div class="gallery-grid">
  {{ range .Sections }}
    {{ $latest := index .RegularPages 0 }}
    <a href="{{ .Permalink }}" class="gallery-tile">
      {{ if $latest }}
        {{ $img := $latest.Resources.ByType "image" | first 1 }}
        {{ range $img }}
          <img src="{{ .RelPermalink }}" alt="{{ $.Title }}" loading="lazy">
        {{ end }}
      {{ end }}
      <span class="gallery-tile-title">{{ .Title }}</span>
    </a>
  {{ end }}
</div>
{{ end }}
